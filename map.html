<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyMap</title>
<link rel="icon" type="image/png" href="https://cdn.iconscout.com/icon/free/png-512/free-google-my-maps-logo-icon-svg-download-png-3955526.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://unpkg.com/leaflet.gridlayer.googlemutant@0.14.0/dist/Leaflet.GoogleMutant.js"></script>
<!-- Turf.js (geospatial ops for route editing: nearest-point, line-split, length). -->
<script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
<link rel="stylesheet" href="header.css"/>
<style>
 :root{color-scheme:dark;--bg:#1b1f24;--bg2:#23282f;--fg:#e6e6e6;--mut:#9aa4b0;--bd:#3a414b;--ac:#60a5fa;--hv:#2c333d;
   --surface:rgba(27,31,36,.95);--surface2:rgba(27,31,36,.96);--mapbg:#0e1116;--overlay:rgba(14,17,22,.85)}
 html.light{--bg:#eef1f5;--bg2:#ffffff;--fg:#1b2430;--mut:#5b6675;--bd:#d3d8e0;--ac:#1d4ed8;--hv:#e8ecf2;
   --surface:rgba(255,255,255,.96);--surface2:rgba(255,255,255,.97);--mapbg:#e8eaed;--overlay:rgba(245,247,250,.92)}
 html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
   font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
 #map{position:absolute;top:44px;left:0;right:0;bottom:0;background:var(--mapbg)}
 /* floating fullscreen button (bottom-right, Google-Maps style) */
 .map-fs{position:absolute;bottom:26px;right:10px;z-index:1000;width:34px;height:34px;
   display:flex;align-items:center;justify-content:center;cursor:pointer;
   background:var(--surface);border:1px solid var(--bd);color:var(--fg);
   border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.5)}
 .map-fs:hover{background:var(--hv)}
 .map-fs .material-symbols-outlined{font-size:20px}
 /* fullscreen: hide header, let the map fill the screen */
 body.fs .app-header{display:none}
 body.fs #map{top:0}
 body.fs .panel{top:10px}
 body.fs .panel-reopen{top:10px}
 /* on-map basemap + theme control (mirrors MyMap) */
 .mm-basectl{position:relative;display:flex;flex-direction:column;
   box-shadow:0 2px 10px rgba(0,0,0,.5);border-radius:8px}
 .mm-iconbtn{width:32px;height:32px;display:flex;align-items:center;
   justify-content:center;background:var(--surface);
   border:1px solid var(--bd);color:var(--fg);font-size:15px;
   line-height:1;cursor:pointer;padding:0}
 .mm-iconbtn:first-of-type{border-radius:8px 8px 0 0}
 .mm-iconbtn:last-of-type{border-radius:0 0 8px 8px;border-top:none}
 .mm-iconbtn:hover{background:var(--hv)}
 .mm-basemenu{position:absolute;right:38px;top:0;display:none;
   flex-direction:column;gap:4px;background:var(--surface);
   border:1px solid var(--bd);border-radius:8px;padding:6px;
   box-shadow:0 4px 14px rgba(0,0,0,.55)}
 .mm-basemenu.open{display:flex}
 .mm-basemenu button{font:inherit;font-size:12px;color:var(--fg);
   background:var(--bg2);border:1px solid var(--bd);border-radius:6px;
   padding:5px 10px;cursor:pointer;text-align:left;white-space:nowrap}
 .mm-basemenu button:hover{background:var(--hv)}
 .mm-basemenu button.on{outline:2px solid var(--ac)}
 .material-symbols-outlined{font-family:'Material Symbols Outlined';
   font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;
   -webkit-font-feature-settings:'liga';font-feature-settings:'liga';user-select:none}
 .mm-iconbtn .material-symbols-outlined{font-size:19px}
 .panel{position:absolute;top:54px;left:10px;z-index:1000;width:330px;
   background:var(--surface);border:1px solid var(--bd);border-radius:10px;
   box-shadow:0 4px 18px rgba(0,0,0,.55);max-height:92vh;font-size:13px;
   display:flex;flex-direction:column;overflow:hidden}
 .panel.collapsed{display:none}
 .panel .pad{flex:0 0 auto}                 /* sticky header (title + buttons) */
 .panel #list{flex:1 1 auto;overflow-y:auto;overflow-x:hidden}  /* only the list scrolls */
 .panel-reopen{position:absolute;top:54px;left:10px;z-index:1001;display:none;
   width:38px;height:38px;border-radius:8px;background:var(--surface);
   border:1px solid var(--bd);color:var(--fg);cursor:pointer;
   align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.5)}
 .panel-reopen.show{display:flex}
 .panel-reopen .material-symbols-outlined{font-size:20px}
 .pad{padding:10px 12px}
 .pad .titlebar{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
 .pad h1{margin:0;font-size:16px;color:var(--fg);flex:1}
 .home-link{display:inline-flex;align-items:center;color:var(--mut);text-decoration:none;
   padding:2px;border-radius:4px}
 .home-link:hover{color:var(--fg);background:var(--hv)}
 .home-link .material-symbols-outlined{font-size:18px}
 .pad .counts{color:var(--mut);font-size:12px;display:flex;align-items:center;
   gap:3px;margin-top:8px}
 .pad .counts .mi{font-family:'Material Symbols Outlined';font-weight:normal;font-size:15px;
   line-height:1;vertical-align:-2px;margin-left:14px;margin-right:2px;
   -webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
 .pad .counts .mi:first-child{margin-left:0}
 .panel-collapse{background:none;border:none;color:var(--mut);cursor:pointer;
   padding:2px;line-height:1;display:flex;align-items:center}
 .panel-collapse:hover{color:var(--fg)}
 .panel-collapse .material-symbols-outlined{font-size:20px}
 .sub{color:var(--mut);font-size:11px;line-height:1.5;margin:4px 0 0}
 .grp{border-top:1px solid var(--bd);padding:8px 12px}
 .gh{display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;color:var(--fg)}
 .gh .tw{color:var(--mut);font-size:10px;width:10px}
 .gh .gn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .gh .gp-eye{cursor:pointer;display:inline-flex;align-items:center;
   color:var(--mut);padding:2px 4px;border-radius:4px;line-height:1}
 .gh .gp-eye:hover{color:var(--fg);background:var(--hv)}
 .gh .gp-eye .material-symbols-outlined{font-size:16px}
 .gh .gcount{color:var(--mut);font-size:11px;min-width:20px;text-align:right;
   font-weight:normal}
 .it{display:flex;align-items:center;gap:7px;padding:3px 4px 3px 22px;cursor:pointer;
   border-radius:6px;line-height:1.25;border-left:2px solid transparent}
 .it:hover{background:var(--hv)}
 .it.active{background:rgba(96,165,250,.18);border-left-color:var(--ac);font-weight:600}
 .sw{width:18px;height:3px;border-radius:2px;flex:0 0 auto}
 .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .it .it-dl{flex:0 0 auto;opacity:.25;cursor:pointer;color:var(--mut);
   padding:1px 3px;border-radius:4px;display:inline-flex;align-items:center}
 .it:hover .it-dl{opacity:1}
 .it .it-dl:hover{color:var(--fg);background:var(--hv)}
 .it .it-dl .material-symbols-outlined{font-size:15px}
 .btns{display:flex;gap:6px;margin:8px 0 0}
 .btns button{flex:1;font:inherit;font-size:12px;color:var(--fg);background:var(--bg2);
   border:1px solid var(--bd);border-radius:6px;padding:5px;cursor:pointer;
   display:flex;align-items:center;justify-content:center}
 .btns button:hover{background:var(--hv)}
 .btns button .material-symbols-outlined{font-size:18px}
 .rt-tip{background:var(--surface)!important;color:var(--fg)!important;
   border:1px solid var(--bd)!important;font-size:11px!important;padding:3px 8px!important}
 .rt-tip:before{border-top-color:var(--bd)!important}
 .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--bg2);color:var(--fg)}
 /* keep Leaflet's own width sizing (min/maxWidth from bindPopup); only allow CJK
    long names to wrap naturally — DO NOT force width:auto or word-break:break-word
    on CJK (that collapses the popup to 1 character per line). */
 .leaflet-popup-content{margin:10px 14px;line-height:1.4;overflow-wrap:anywhere}
 .leaflet-popup-content b{display:block;font-size:13px;cursor:text}   /* title is selectable now */
 .leaflet-popup-pane{z-index:1100}   /* popups above the floating buttons/controls */
 .rt-drag{float:left;margin:0 7px 0 -2px;color:var(--mut);cursor:move;
   font-size:16px;line-height:1.15;padding:2px 6px;border-radius:4px;user-select:none;
   touch-action:none;-webkit-user-select:none}   /* touch-action:none = drag works on mobile */
 .rt-drag:hover{color:var(--fg);background:var(--hv)}
 .rt-drag:active{background:var(--hv);color:var(--fg)}
 .leaflet-popup-content-wrapper{cursor:default}
 .leaflet-popup-content-wrapper.rt-dragging{opacity:.92}
 .rt-links{margin-top:4px;font-size:11px}
 .rt-desc{margin-top:6px;font-size:11px;color:#c9d0d8}
 /* pin popup: compact header + editable description, icon-only action buttons */
 .pin-head{display:flex;align-items:center;gap:2px}
 .pin-head .rt-drag{flex:0 0 auto;cursor:move;color:var(--mut);user-select:none}
 .pin-name{flex:1;color:var(--fg);font-weight:600;overflow:hidden;
   text-overflow:ellipsis;white-space:nowrap;min-width:0}
 .pin-act{flex:0 0 auto;background:none;border:none;color:var(--mut);
   cursor:pointer;padding:3px;border-radius:6px;display:flex;align-items:center;line-height:1}
 .pin-act:hover{color:var(--fg);background:var(--hv)}
 .pin-act .mi{font-family:'Material Symbols Outlined';font-weight:normal;font-size:17px;
   -webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
 .pin-desc{margin-top:4px;font-size:11px;color:#c9d0d8;cursor:text;outline:none;
   padding:3px 4px;border-radius:4px;line-height:1.35;white-space:pre-wrap;word-break:break-word;min-height:1.2em}
 .pin-desc:hover{background:var(--hv)}
 .pin-desc:focus{background:var(--bg);outline:1px solid var(--ac)}
 .pin-desc:empty::before{content:"+ add description";color:var(--mut);font-style:italic}
 .pin-desc:focus:empty::before{content:""}
 .pin-name{outline:none;cursor:text}
 .pin-name:hover{background:var(--hv);border-radius:4px}
 .pin-name:focus{background:var(--bg);outline:1px solid var(--ac);border-radius:4px;
   white-space:normal;text-overflow:clip;overflow:visible}
 .rt-name{outline:none;cursor:text}
 .rt-name:hover{background:var(--hv);border-radius:4px}
 .rt-name:focus{background:var(--bg);outline:1px solid var(--ac);border-radius:4px}
 .rt-gm .mi{color:#EA4335;font-size:18px;line-height:1}
 .rt-actions{margin-left:auto;display:flex;gap:2px;align-items:center}
 /* elevation profile + linked hover overlay (crosshair / dot / tip) */
 .rt-prof{position:relative;margin-top:6px;height:44px;cursor:default;touch-action:none}
 .rt-prof-cross{position:absolute;top:0;height:44px;width:1px;margin-left:-0.5px;
   background:var(--mut);opacity:0;pointer-events:none}
 .rt-prof-dot{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;
   background:#2979ff;border:1.5px solid #fff;box-shadow:0 0 2px rgba(0,0,0,.6);
   opacity:0;pointer-events:none}
 .rt-prof-tip{position:absolute;transform:translateX(-50%);background:var(--bg2);color:var(--fg);
   border:1px solid var(--bd);border-radius:4px;font-size:10px;line-height:1.3;padding:1px 5px;
   white-space:nowrap;opacity:0;pointer-events:none}
 .rt-prof.active .rt-prof-cross,.rt-prof.active .rt-prof-dot,.rt-prof.active .rt-prof-tip{opacity:1}
 .rt-stats{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;font-size:11px;color:#9aa4b0;
   align-items:center}
 .rt-stats .mi{font-family:'Material Symbols Outlined';font-weight:normal;font-size:14px;
   line-height:1;vertical-align:-2px;letter-spacing:0;
   -webkit-font-feature-settings:'liga';font-feature-settings:'liga';
   margin-right:1px}
 /* same muted look as the stats row; flex gap spaces items so wraps stay left-aligned */
 .rt-dl{margin-top:8px;display:flex;flex-wrap:wrap;justify-content:flex-start;
   align-items:center;gap:6px 14px;font-size:11px;color:var(--mut)}
 .rt-dl a{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;
   color:var(--mut);text-decoration:none}
 .rt-dl a:hover{color:var(--ac)}
 .rt-dl .mi{font-family:'Material Symbols Outlined';font-weight:normal;font-size:14px;
   line-height:1;vertical-align:-2px;color:var(--mut);
   -webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
 .leaflet-popup-content a{color:var(--ac)} a{color:var(--ac)}
 .leaflet-bar a{background:var(--bg2);color:var(--fg);border-color:var(--bd)}
 .leaflet-control-attribution{display:none}   /* hide the Leaflet/© line (mobile + desktop) */
 /* loading overlay over the map area. spinner uses a transform animation so it
    keeps spinning on the compositor even while the main thread builds routes. */
 .loading{position:absolute;top:44px;left:0;right:0;bottom:0;z-index:1500;
   display:flex;flex-direction:column;align-items:center;justify-content:center;
   gap:14px;background:var(--overlay);color:var(--fg);font-size:14px;
   text-align:center;padding:24px}
 .loading #loadingMsg{max-width:92%;word-break:break-word;line-height:1.5}
 /* on-screen debug log (temporary, for mobile diagnosis) */
 .dbglog{position:fixed;left:0;right:0;bottom:0;z-index:2000;max-height:40vh;overflow:auto;
   background:rgba(0,0,0,.85);color:#9fe7ff;font:11px/1.45 ui-monospace,Menlo,monospace;
   padding:8px 34px 8px 10px;white-space:pre-wrap;word-break:break-word}
 .dbglog .err{color:#ff9b9b}
 .dbglog.collapsed{display:none}
 .dbglog .log-copy{position:sticky;top:0;float:right;background:#234;color:#fff;
   border:1px solid #456;border-radius:6px;font-size:11px;padding:2px 8px;cursor:pointer}
 .dev-btn{position:fixed;left:8px;bottom:8px;z-index:2001;width:30px;height:30px;
   display:flex;align-items:center;justify-content:center;background:var(--surface);
   border:1px solid var(--bd);color:var(--mut);border-radius:8px;cursor:pointer;opacity:.55}
 .dev-btn:hover{opacity:1;color:var(--fg)}
 .dev-btn .material-symbols-outlined{font-size:18px}
 /* locate-me (GPS) button — bottom-right, above fullscreen, Google-Maps style */
 .map-loc{position:absolute;bottom:68px;right:10px;z-index:1000;width:34px;height:34px;
   display:flex;align-items:center;justify-content:center;cursor:pointer;
   background:var(--surface);border:1px solid var(--bd);color:var(--fg);
   border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.5)}
 .map-loc:hover{background:var(--hv)}
 .map-loc.busy{opacity:.5}.map-loc.on{color:#4f9bff}
 .map-loc .material-symbols-outlined{font-size:20px}
 body.fs .map-loc{bottom:68px}
 .loading.hidden{display:none}
 .loading .spinner{width:34px;height:34px;border:3px solid var(--bd);
   border-top-color:var(--ac);border-radius:50%;animation:mmspin .8s linear infinite}
 .loading.err{color:#f88}.loading.err .spinner{display:none}
 @keyframes mmspin{to{transform:rotate(360deg)}}
 body.fs .loading{top:0}
 /* mobile: don't let the panel cover the whole map, even expanded */
 /* export modal */
 .exp-modal{position:fixed;inset:0;z-index:1600;display:flex;align-items:center;
   justify-content:center;background:rgba(0,0,0,.45);padding:16px}
 .exp-modal[hidden]{display:none}
 .exp-dialog{width:380px;max-width:100%;max-height:86vh;display:flex;flex-direction:column;
   background:var(--bg2);color:var(--fg);border:1px solid var(--bd);border-radius:12px;
   box-shadow:0 10px 40px rgba(0,0,0,.5);font-size:13px;overflow:hidden}
 .exp-head{display:flex;align-items:center;justify-content:space-between;
   padding:12px 14px;border-bottom:1px solid var(--bd);font-weight:600;font-size:15px}
 .exp-x{background:none;border:none;color:var(--mut);font-size:20px;cursor:pointer;line-height:1}
 .exp-x:hover{color:var(--fg)}
 .exp-scopes{display:flex;flex-direction:column;gap:6px;padding:12px 14px 6px}
 .exp-scopes label{display:flex;align-items:center;gap:8px;cursor:pointer}
 .exp-tree{flex:1 1 auto;overflow-y:auto;padding:4px 14px;border-top:1px solid var(--bd)}
 .exp-grp{padding:4px 0}
 .exp-grp>label{display:flex;align-items:center;gap:7px;font-weight:600;cursor:pointer}
 .exp-grp .gcnt{margin-left:auto;color:var(--mut);font-weight:normal;font-size:11px}
 .exp-rts{margin:2px 0 4px 22px;display:none}
 .exp-rts.open{display:block}
 .exp-rts label{display:flex;align-items:center;gap:7px;cursor:pointer;line-height:1.5;color:var(--fg)}
 .exp-rts .gcnt{margin-left:auto;color:var(--mut);font-size:11px}
 .exp-grp .tw{cursor:pointer;color:var(--mut);font-size:10px;width:12px;text-align:center;user-select:none}
 .exp-meter{padding:10px 14px;border-top:1px solid var(--bd);font-size:12px;color:var(--mut)}
 .exp-meter .mi{font-family:'Material Symbols Outlined';font-weight:normal;font-size:16px;
   vertical-align:-3px;margin-right:3px;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
 .exp-meter .over{color:#e0564f;font-weight:600}
 .exp-meter .warn{color:#e0564f;font-weight:600;margin-bottom:3px}
 .exp-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;
   padding:12px 14px;border-top:1px solid var(--bd)}
 .exp-fmt label{margin-left:8px;cursor:pointer}
 .exp-go{background:var(--ac);color:#fff;border:none;border-radius:8px;
   padding:7px 18px;font:inherit;font-weight:600;cursor:pointer}
 .exp-go:hover{filter:brightness(1.08)}
 /* ---- add-place search box (feature: place search -> add pin) ---- */
 .searchbox{margin:8px 0 0}
 .searchbox .srow{display:flex;gap:6px}
 .searchbox input{flex:1;font:inherit;font-size:13px;color:var(--fg);background:var(--bg2);
   border:1px solid var(--bd);border-radius:6px;padding:6px 8px;box-sizing:border-box}
 .searchbox button{font:inherit;color:var(--fg);background:var(--bg2);border:1px solid var(--bd);
   border-radius:6px;padding:0 9px;cursor:pointer;display:flex;align-items:center}
 .searchbox button:hover{background:var(--hv)}
 .searchbox button .material-symbols-outlined{font-size:18px}
 /* ---- floating place-search (Google My Maps style) ---- */
 .placesearch{position:absolute;top:54px;left:350px;z-index:1100;width:300px}
 body.fs .placesearch{top:10px}
 .placesearch .ps-bar{display:flex;align-items:center;gap:2px;background:var(--surface);
   border:1px solid var(--bd);border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.55);padding:3px 5px}
 .placesearch .ps-bar input{flex:1;min-width:0;font:inherit;font-size:13px;color:var(--fg);
   background:none;border:none;outline:none;padding:6px 2px}
 .placesearch .ps-bar input::placeholder{color:var(--mut)}
 .ps-go,.ps-clear{background:none;border:none;color:var(--mut);cursor:pointer;flex:0 0 auto;
   display:flex;align-items:center;padding:3px;border-radius:6px}
 .ps-go:hover,.ps-clear:hover{color:var(--fg);background:var(--hv)}
 .ps-go .material-symbols-outlined,.ps-clear .material-symbols-outlined{font-size:19px}
 .ps-clear[hidden]{display:none}          /* hide when empty (desktop); shown on mobile as close */
 .ps-toggle{display:none}                 /* desktop: the bar is always visible */
 #psresults{margin-top:6px;max-height:260px;overflow:auto;background:var(--surface);
   border:1px solid var(--bd);border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.55);padding:4px}
 #psresults:empty{display:none}
 #psresults .pr{padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px}
 #psresults .pr:hover{background:var(--hv)}
 #psresults .pr b{color:var(--fg)}
 #psresults .pr .a{color:var(--mut);font-size:11px;display:block;
   white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #psmsg{margin:6px 0 0}
 #psmsg:empty{display:none}
 #psmsg:not(:empty){background:var(--surface);border:1px solid var(--bd);border-radius:8px;
   padding:5px 8px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
 .ps-add{margin-top:8px;font:inherit;font-size:12px;color:#fff;background:var(--ac);
   border:none;border-radius:6px;padding:6px 12px;cursor:pointer}
 .ps-add:hover{filter:brightness(1.08)}
 /* pin icon + color picker (Google My Maps "Newer" library) */
 .pe-modal{position:fixed;inset:0;z-index:1700;display:flex;align-items:center;justify-content:center;
   background:rgba(0,0,0,.45);padding:16px}
 .pe-modal[hidden]{display:none}
 .pe-dialog{width:344px;max-width:100%;max-height:82vh;display:flex;flex-direction:column;
   background:var(--bg2);color:var(--fg);border:1px solid var(--bd);border-radius:12px;
   box-shadow:0 10px 40px rgba(0,0,0,.5);font-size:13px;overflow:hidden}
 .pe-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;
   border-bottom:1px solid var(--bd);font-weight:600}
 .pe-x{background:none;border:none;color:var(--mut);font-size:20px;cursor:pointer;line-height:1}
 .pe-x:hover{color:var(--fg)}
 .pe-body{padding:10px 14px;overflow-y:auto}
 .pe-colors{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
 .pe-col{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
 .pe-col.on{border-color:var(--fg)}
 .pe-icons{display:block}
 .pe-search{width:100%;font:inherit;font-size:13px;color:var(--fg);background:var(--bg2);
   border:1px solid var(--bd);border-radius:6px;padding:6px 8px;box-sizing:border-box;
   margin-bottom:8px;outline:none}
 .pe-search:focus{border-color:var(--ac)}
 .pe-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
 .pe-recent{margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
 .pe-recent[hidden]{display:none}
 .pe-empty{padding:18px 8px;color:var(--mut);text-align:center;font-size:12px}
 .pe-ic{background:none;border:1px solid transparent;border-radius:6px;padding:3px;cursor:pointer;
   display:flex;align-items:center;justify-content:center}
 .pe-ic:hover{background:var(--hv)}
 .pe-ic.on{border-color:var(--ac);background:var(--hv)}
 .pe-ic img{width:22px;height:24px;display:block;object-fit:contain}
 /* keep the pin/icon images at their true colors against any browser forced-dark / high-contrast scheme */
 img.leaflet-marker-icon, .pe-ic img, #pinsSection .it img, .placesearch img{forced-color-adjust:none}
 /* admin button "unsaved changes" badge */
 #adminBtn{position:relative}
 /* admin: inline X inside the token input, shown only when a token is stored */
 .tk-wrap{flex:1;position:relative;display:flex;min-width:0}
 .tk-wrap input{flex:1;padding-right:26px;min-width:0}
 .tk-clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);
   background:none;border:none;color:var(--mut);cursor:pointer;padding:2px;
   border-radius:4px;display:flex;align-items:center}
 .tk-clear:hover{color:var(--fg);background:var(--hv)}
 .tk-clear .material-symbols-outlined{font-size:16px}
 .tk-clear[hidden]{display:none}
 .dirty-badge{position:absolute;top:-3px;right:-3px;background:#e0564f;color:#fff;
   border-radius:9px;min-width:14px;height:14px;padding:0 3px;font-size:9px;
   font-weight:700;line-height:14px;text-align:center;box-shadow:0 0 0 1px var(--surface);
   pointer-events:none;box-sizing:border-box}
 /* Route-edit modal banner (split / vertex-drag) — top-center, floating */
 #splitBanner, #vertBanner{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:1500;
   background:var(--surface);border:1px solid var(--bd);border-radius:8px;
   padding:8px 12px;color:var(--fg);font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.4);
   display:flex;align-items:center;gap:10px;max-width:calc(100vw - 28px)}
 #splitBanner b, #vertBanner b{color:var(--fg)}
 #splitBanner button, #vertBanner button{font:inherit;font-size:12px;border-radius:6px;
   border:1px solid var(--bd);padding:4px 10px;cursor:pointer;color:var(--fg);background:var(--bg2)}
 #splitBanner button:hover, #vertBanner button:hover{background:var(--hv)}
 #splitBanner button.ok, #vertBanner button.ok{background:#2979ff;color:#fff;border-color:#2979ff}
 #splitBanner button.ok:hover, #vertBanner button.ok:hover{background:#1565d8}
 /* Split cut-point marker: same shape as a vertex dot but red, so it pins
    the exact split location without covering a chunk of the route line.
    The host gives a generous touch target for mobile. */
 .rt-scissors-host{display:flex;align-items:center;justify-content:center;cursor:grab}
 .rt-scissors-host:active{cursor:grabbing}
 .rt-scissors{width:14px;height:14px;background:#e0564f;border:2px solid #fff;
   border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.6);box-sizing:border-box;
   pointer-events:none}
 /* Vertex-drag editor: small visible dot inside a larger transparent touch
    target. The host div is sized by the divIcon (22x22) so finger taps land
    reliably; the visible dot stays 10x10 to keep the route readable. */
 .rt-vert-host{display:flex;align-items:center;justify-content:center;cursor:grab}
 .rt-vert-host:active{cursor:grabbing}
 .rt-vert{width:10px;height:10px;background:#2979ff;border:2px solid #fff;
   border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.5);box-sizing:border-box;
   pointer-events:none}   /* dot is decorative; click/drag is handled by .rt-vert-host */
 .rt-vert.endpoint{background:#f4b400}   /* first / last vertex stand out */
 /* Direction chevrons + km distance labels — only rendered while a route's
    popup is open. Both SVG-based so they look identical on every OS:
    chevrons have a navy outline + white core (clear on the blue selected
    line); km labels are dark digits with a white text-halo (paint-order
    stroke→fill) so they pop on any basemap without a background pill. */
 .rt-chev, .rt-km{pointer-events:none;display:block;line-height:0}
 .rt-chev svg, .rt-km svg{display:block;overflow:visible}
 /* Search / "+ new route" row + per-item dirty dot */
 #routeSearch{margin:8px 0 4px;display:flex;gap:6px;align-items:center}
 #routeSearch input{flex:1;background:var(--bg);border:1px solid var(--bd);color:var(--fg);
   border-radius:6px;padding:5px 8px;font:inherit;font-size:12px;outline:none}
 #routeSearch input:focus{border-color:var(--ac)}

   padding:0;display:flex;align-items:center;justify-content:center}
 #routeNewBtn:hover{background:var(--hv);color:var(--ac)}
 .it .it-dot{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:#e0564f;
   margin-left:2px;display:none}
 .it.dirty .it-dot{display:block}
 /* Elevation-recompute status banner (auto-creates while a fetch is running) */
 #elevBanner{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:1500;
   background:var(--surface);border:1px solid var(--bd);border-radius:8px;
   padding:8px 14px;color:var(--fg);font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
 #elevBanner.err{border-color:#e0564f;color:#e0564f}
 /* Route color picker (opens in a Leaflet popup at the route center) */
 .rt-pal{display:flex;flex-direction:column;gap:8px}
 .rt-pal-grid{display:grid;grid-template-columns:repeat(5,26px);gap:6px}
 .rt-pal .swc{width:26px;height:26px;border:1px solid var(--bd);border-radius:6px;
   cursor:pointer;padding:0;outline:0}
 .rt-pal .swc:hover{outline:2px solid var(--ac)}
 .rt-pal-custom{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:8px}
 .rt-pal-custom input[type=color]{width:28px;height:28px;border:1px solid var(--bd);
   padding:0;background:transparent;cursor:pointer}
 @media (max-width:600px){
   /* leave room on the right for the zoom / basemap / recenter controls */
   .panel{width:calc(100vw - 64px);max-width:330px;max-height:40vh}
   /* mobile: collapse the search to a top-right icon; it takes the top slot of
      the right column and pushes the zoom/basemap stack down. Tapping expands a
      full-width bar that overlays the top (higher z-index than the panel). */
   .placesearch{top:54px;right:10px;left:auto;width:auto}
   .placesearch:not(.open) .ps-bar,
   .placesearch:not(.open) #psresults,
   .placesearch:not(.open) #psmsg{display:none}
   .ps-toggle{display:flex;width:38px;height:38px;border-radius:8px;background:var(--surface);
     border:1px solid var(--bd);color:var(--fg);cursor:pointer;align-items:center;
     justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.5);padding:0}
   .ps-toggle .material-symbols-outlined{font-size:20px}
   .placesearch.open{left:10px;right:10px;width:auto}
   .placesearch.open .ps-toggle{display:none}
   .leaflet-top.leaflet-right{margin-top:46px}
   /* Route-edit modal banners (split/vert/merge/extend) + elev status banner:
      stretch full-width with the same left/right margin, wrap text + buttons to
      multiple lines so the long help string never gets clipped on narrow phones. */
   #splitBanner, #vertBanner, #elevBanner{
     left:8px; right:8px; transform:none; max-width:none;
     flex-wrap:wrap; gap:8px; padding:10px 12px; font-size:13px;
     justify-content:center;
   }
   #splitBanner > span, #vertBanner > span{flex-basis:100%; text-align:center; line-height:1.4}
   #splitBanner button, #vertBanner button{flex:1 1 auto; min-width:96px; padding:8px 12px; font-size:13px}
   /* Popup action row: 8 icons can be too wide for a 240px popup — let them wrap,
      and use slightly larger padding for thumb-sized hit targets. */
   .rt-actions{flex-wrap:wrap; gap:4px}
   .pin-act{padding:4px 6px}
   .pin-act .mi{font-size:18px}
 }

<script>
// Route data is loaded at runtime from data/routes_base.geojson (keeps this
// file tiny). Convert each GeoJSON Feature back to the internal route shape.
let R=[];
function featureToRoute(f){
 const p=f.properties||{};
 const co=(f.geometry&&f.geometry.coordinates)||[];
 const polys=co.map(line=>line.map(c=>c.length>2?[c[1],c[0],c[2]]:[c[1],c[0]]));
 return {id:p.id,name:p.name,group:p.group,source:p.source,distance_km:p.distance_km,
   elev_up_m:p.elev_up_m,intro_url:p.intro_url,difficulty:p.difficulty,profile:p.profile,
   rwgps_url:p.rwgps_url,strava_url:p.strava_url,desc:p.desc,
   weight:p.weight||2,color:p.color,opacity:(p.opacity!=null?p.opacity:0.9),
   dash:p.dash||[0,0],style:p.style||'solid',polys:polys,
   // edit metadata — survives across split/rename/etc. so the dirty diff matches
   // routes back to their original seed entry. Absent on shipped seed → defaulted
   // to id at seed-capture time below.
   seed_id:p.seed_id, edited_at:p.edited_at, edit_ops:p.edit_ops||[],
   original_distance_km:p.original_distance_km, original_elev_up_m:p.original_elev_up_m,
   elev_src:p.elev_src};
}
function routeToFeature(r){
 const coords=(r.polys||[]).map(poly=>poly.map(pt=>pt.length>2?[pt[1],pt[0],pt[2]]:[pt[1],pt[0]]));
 const props={};
 ['id','name','group','source','distance_km','elev_up_m','intro_url','difficulty','profile',
  'rwgps_url','strava_url','desc','elev_src',
  'seed_id','edited_at','edit_ops','original_distance_km','original_elev_up_m']
   .forEach(k=>{ if(r[k]!=null && !(Array.isArray(r[k])&&!r[k].length)) props[k]=r[k]; });
 if((r.weight||2)!==2) props.weight=r.weight;
 if(r.opacity!=null && r.opacity!==0.9) props.opacity=r.opacity;
 if((r.style||'solid')!=='solid') props.style=r.style;
 if(r.dash && (r.dash[0]||r.dash[1])) props.dash=r.dash;
 if(r.color) props.color=r.color;
 return {type:'Feature', geometry:{type:'MultiLineString', coordinates:coords}, properties:props};
}
const MAP_ID=(new URLSearchParams(location.search).get('id'))||'japan-cycling';
// ---- route editing: localStorage layer + seed snapshot (parallel to pin model) ----
// Editing is opt-in (Phase 1 ships the UI); this plumbing exists from Phase 0 so
// dirty/save/discard all "just work" once split/reverse/etc. land.
const RKEY='mymap.routes.'+MAP_ID;
const RDEL_KEY='mymap.routes.'+MAP_ID+'.del';
let SEED_ROUTES=null;   // snapshot of routes as served from the repo; used for diffing
function loadLocalRoutes(){ try{ return JSON.parse(localStorage.getItem(RKEY)||'[]'); }catch(e){ return []; } }
function loadDeletedSeeds(){ try{ return new Set(JSON.parse(localStorage.getItem(RDEL_KEY)||'[]')); }catch(e){ return new Set(); } }
function normRoute(r){
 // strip auto-derived fields so they don't cause false dirties after recomputation
 const c={...r}; delete c.distance_km; delete c.elev_up_m; delete c.profile; delete c.edited_at;
 return JSON.stringify(c);
}
function saveLocalRouteState(){
 if(!SEED_ROUTES) return;
 const seedById=new Map(SEED_ROUTES.map(s=>[s.seed_id,s]));
 const seenSeeds=new Set();
 const modified=[];
 R.forEach(r=>{
   if(r.seed_id==null){ modified.push(JSON.parse(JSON.stringify(r))); return; }
   seenSeeds.add(r.seed_id);
   const s=seedById.get(r.seed_id);
   if(!s){ modified.push(JSON.parse(JSON.stringify(r))); return; }
   if(normRoute(r)!==normRoute(s)) modified.push(JSON.parse(JSON.stringify(r)));
 });
 const deleted=[];
 SEED_ROUTES.forEach(s=>{ if(!seenSeeds.has(s.seed_id)) deleted.push(s.seed_id); });
 try{ localStorage.setItem(RKEY,JSON.stringify(modified)); }catch(e){}
 try{ localStorage.setItem(RDEL_KEY,JSON.stringify(deleted)); }catch(e){}
 if(typeof updateDirtyBadge==='function') updateDirtyBadge();
 if(typeof refreshRouteDirtyDots==='function') refreshRouteDirtyDots();
}
function routeDiffCount(){
 if(SEED_ROUTES==null) return 0;
 const seedById=new Map(SEED_ROUTES.map(s=>[s.seed_id,s]));
 const seenSeeds=new Set();
 let n=0;
 R.forEach(r=>{
   if(r.seed_id==null){ n++; return; }
   seenSeeds.add(r.seed_id);
   const s=seedById.get(r.seed_id);
   if(!s){ n++; return; }
   if(normRoute(r)!==normRoute(s)) n++;
 });
 SEED_ROUTES.forEach(s=>{ if(!seenSeeds.has(s.seed_id)) n++; });
 return n;
}
// ---- Google integration (basemap + place search) ----
// config.js sets window.MYMAP_CONFIG.googleMapsApiKey. It's a CLIENT key for a
// public static site (visible by design); it is safe only because it's locked
// down in Cloud Console with an HTTP-referrer restriction + API restriction.
// With no key, Google features stay off and the free OSM/Esri maps still work.
const CFG=window.MYMAP_CONFIG||{};
let _googleLoad=null;
function loadGoogle(){
 if(_googleLoad) return _googleLoad;
 if(!CFG.googleMapsApiKey) return Promise.reject(new Error('no Google API key in config.js'));
 _googleLoad=new Promise((res,rej)=>{
   const s=document.createElement('script');
   s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(CFG.googleMapsApiKey)
        +'&libraries=places&v=quarterly&loading=async';
   s.async=true;
   s.onload=()=>res();
   s.onerror=()=>rej(new Error('Google Maps failed to load (check API key / referrer restriction / billing)'));
   document.head.appendChild(s);
 });
 return _googleLoad;
}
// native Google night cartography (true dark map, not a CSS filter)
const GOOGLE_DARK=[
 {elementType:'geometry',stylers:[{color:'#26303b'}]},
 {elementType:'labels.text.fill',stylers:[{color:'#d6dde8'}]},
 {elementType:'labels.text.stroke',stylers:[{color:'#0f141a'}]},
 {featureType:'landscape',elementType:'geometry',stylers:[{color:'#21342a'}]},
 {featureType:'landscape.man_made',elementType:'geometry',stylers:[{color:'#283a30'}]},
 {featureType:'poi',elementType:'labels.text.fill',stylers:[{color:'#8b95a2'}]},
 {featureType:'poi.business',elementType:'labels',stylers:[{visibility:'off'}]},
 {featureType:'poi.park',elementType:'geometry',stylers:[{color:'#1c4630'}]},
 {featureType:'poi.park',elementType:'labels.text.fill',stylers:[{color:'#86b894'}]},
 {featureType:'road',elementType:'geometry',stylers:[{color:'#424e5b'}]},
 {featureType:'road',elementType:'geometry.stroke',stylers:[{color:'#222a33'}]},
 {featureType:'road',elementType:'labels.text.fill',stylers:[{color:'#c6cdd8'}]},
 {featureType:'road.highway',elementType:'geometry',stylers:[{color:'#5a6675'}]},
 {featureType:'road.highway',elementType:'geometry.stroke',stylers:[{color:'#283039'}]},
 {featureType:'road.highway',elementType:'labels.text.fill',stylers:[{color:'#e8edf3'}]},
 {featureType:'transit',elementType:'geometry',stylers:[{color:'#37434f'}]},
 {featureType:'water',elementType:'geometry',stylers:[{color:'#1a5b7d'}]},
 {featureType:'water',elementType:'labels.text.fill',stylers:[{color:'#9cc6da'}]},
 {featureType:'administrative',elementType:'geometry',stylers:[{color:'#4a5563'}]},
 {featureType:'administrative.land_parcel',stylers:[{visibility:'off'}]}
];
// ---- on-screen debug log (temporary; data.js mirrors its breadcrumbs here) ----
const __t0=Date.now();
window.__mmlog=function(msg,isErr){
  const el=document.getElementById('dbglog-lines'); if(!el) return;
  const line=document.createElement('div'); if(isErr) line.className='err';
  line.textContent='+'+(((Date.now()-__t0)/1000).toFixed(1))+'s  '+msg;
  el.appendChild(line); const box=document.getElementById('dbglog'); if(box) box.scrollTop=box.scrollHeight;
};
window.__mmlog('page start · UA: '+navigator.userAgent.slice(0,60));
window.__mmlog('DecompressionStream: '+(typeof DecompressionStream!=='undefined'?'yes':'NO'));
// ---- loading overlay helpers ----
function setLoading(msg){ const el=document.getElementById('loadingMsg'); if(el) el.textContent=msg; }
function hideLoading(){ const el=document.getElementById('loading'); if(el) el.classList.add('hidden'); }
function errorLoading(msg){ const el=document.getElementById('loading'); if(el){ el.classList.remove('hidden'); el.classList.add('err'); } setLoading(msg); window.__mmlog('ERROR: '+msg,true); }
// Apply this map's title/desc (from library.json) to the tab, header and subtitle.
function applyMeta(meta){
 meta=meta||{};
 const title=meta.title||MAP_ID;
 document.title=title+' — MyMap';
 const h=document.getElementById('mapTitle'); if(h) h.textContent=title;
 const d=document.getElementById('mapDesc');
 if(d){ if(meta.desc){ d.textContent=meta.desc; d.hidden=false; } else { d.hidden=true; } }
}
// Look up the library entry (via MyMapData: local files in dev, gist API when
// deployed) so we know the map's metadata + which geojson file to load.
MyMapData.loadLibrary()
 .then(maps=>(maps||[]).find(m=>m.id===MAP_ID)||null)
 .catch(()=>null)
 .then(meta=>{
   applyMeta(meta);
   setLoading('Loading routes…');
   // fall back to the conventional filename if there's no library entry
   return MyMapData.loadMap(meta||{file:MAP_ID+'.geojson'});
 }).then(fc=>{
 setLoading('Preparing routes…');
 R=(fc.features||[]).map(featureToRoute).filter(r=>r.polys&&r.polys.length);
 // Phase 0: ensure every route has a seed_id (default = id), snapshot as SEED_ROUTES,
 // then apply any local-edit overrides from localStorage on top.

function _vertSpawnMarker(idx, polyIdx, vertIdx, isEnd){

function _vertHandleMapClick(ev){

   if(poly.length<2) return;
   try{
     const line=turf.lineString(poly.map(c=>[c[1],c[0]]));

function _endpointDistKm(p,q){

   aEnd_bStart:_endpointDistKm(aEnd,bStart),

// --- elevation recompute (Open-Elevation SRTM30m) -------------------------
// Free public API at api.open-elevation.com. Same SRTM30m data as OpenTopoData,
// but proper CORS headers (OpenTopoData blocks browser-origin fetches).
// POST batches of 100 locations, ~1 req/sec to stay polite. Service is
// community-hosted and occasionally down — error surfaces in the banner.
function _elevBanner(text, isErr){
 let b=document.getElementById('elevBanner');
 if(!b){ b=document.createElement('div'); b.id='elevBanner'; document.body.appendChild(b); }
 b.textContent=text;
 b.className = isErr?'err':'';

}
function _elevBannerHide(){ const b=document.getElementById('elevBanner'); if(b) b.remove(); }
async function routeRecomputeElevation(idx){
 const r=R[idx]; if(!r || !r.polys || !r.polys.length) return;
 try{ map.closePopup(); }catch(e){}
 const refs=[], locs=[];
 r.polys.forEach((poly,pi)=>{
   poly.forEach((pt,vi)=>{ refs.push({pi,vi}); locs.push([pt[0],pt[1]]); });
 });
 if(!locs.length) return;
 const BATCH=100, total=Math.ceil(locs.length/BATCH);
 _elevBanner('Recomputing elevation: 0/'+total+' batches…');
 const alts=new Array(locs.length).fill(null);
 try{
   for(let bi=0; bi<total; bi++){
     const slice=locs.slice(bi*BATCH, (bi+1)*BATCH);
     const body={ locations: slice.map(([la,ln])=>({latitude:+la.toFixed(6), longitude:+ln.toFixed(6)})) };
     const res=await fetch('https://api.open-elevation.com/api/v1/lookup',{
       method:'POST',
       headers:{'Content-Type':'application/json','Accept':'application/json'},
       body:JSON.stringify(body)
     });
     if(!res.ok) throw new Error('Elevation HTTP '+res.status);
     const j=await res.json();
     if(!j||!Array.isArray(j.results)) throw new Error('Elevation response invalid');
     j.results.forEach((row,i)=>{ if(row && row.elevation!=null) alts[bi*BATCH+i]=row.elevation; });
     _elevBanner('Recomputing elevation: '+(bi+1)+'/'+total+' batches…');
     if(bi+1<total) await new Promise(rs=>setTimeout(rs, 1100));   // ~1 req/sec
   }
 }catch(e){
   _elevBanner('Elevation fetch failed: '+(e.message||e)+' (Open-Elevation may be down — try again later)', true);
   return;
 }
 refs.forEach((ref,i)=>{
   const alt=alts[i]; if(alt==null) return;
   const cur=r.polys[ref.pi][ref.vi];
   r.polys[ref.pi][ref.vi]=[cur[0], cur[1], alt];
 });
 let climb=0;
 r.polys.forEach(poly=>{
   for(let i=1;i<poly.length;i++){
     if(poly[i].length>2 && poly[i-1].length>2){
       const d=poly[i][2]-poly[i-1][2]; if(d>0) climb+=d;
     }
   }
 });
 if(r.original_elev_up_m==null && r.elev_up_m!=null) r.original_elev_up_m=r.elev_up_m;
 r.elev_up_m=Math.round(climb);
 // Rebuild profile [cumDist, alt] across all polys
 if(window.turf){
   r.profile=[];
   let cumKm=0;
   r.polys.forEach(poly=>{
     for(let i=0;i<poly.length;i++){
       if(i>0){
         const a=poly[i-1], b=poly[i];
         try{ cumKm += turf.distance([a[1],a[0]],[b[1],b[0]],{units:'kilometers'}); }catch(e){}
       }
       if(poly[i].length>2) r.profile.push([+(cumKm.toFixed(4)), +poly[i][2]]);
     }
   });
 }
 r.edited_at=(new Date()).toISOString();
 (r.edit_ops=r.edit_ops||[]).push({op:'recompute-elevation', at:r.edited_at, climb_m:r.elev_up_m});
 _routeRecomputeDistance(r);
 buildRouteLayer(idx);
 _elevBanner('✓ Elevation recomputed · ↑'+r.elev_up_m+' m');
 setTimeout(_elevBannerHide, 3000);
 saveLocalRouteState();
}

window.routeExtendStart=function(idx, opts){
 const cfg=window.MYMAP_CONFIG||{};
 const key=cfg.openRouteServiceApiKey;
 const allowStraight = !!(opts && opts.allowStraight);
 if(!key && !allowStraight){
   alert('Add `openRouteServiceApiKey` to config.js to enable Extend.\n(Free key: https://openrouteservice.org/dev/#/signup)');
   return;
 }
 if(_vertState||_splitState||_mergeState||_extendState) return;
 const r=R[idx]; if(!r||!r.polys) return;
 try{ map.closePopup(); }catch(e){}
 _keepRouteSelected(idx);
 _extendState={routeIdx:idx, orig:null, busy:false, endpointMarker:null, escHandler:null, mapClickHandler:null, allowStraight, wasNew: !!(opts && opts.wasNew)};
 _extendRefreshEndpointMarker(idx);
 const banner=document.createElement('div'); banner.id='vertBanner';
 const initialMsg = r.polys.length
   ? '⤴ Click on the map to extend <b>'+esc(r.name)+'</b> from its end (yellow dot). ESC cancels.'
   : '✏ Click on the map to set the start of <b>'+esc(r.name)+'</b>, then keep clicking to extend.';
 banner.innerHTML='<span>'+initialMsg+'</span>'
   +'<button class="ok" onclick="window._extendDone();return false">Done</button>'
   +'<button onclick="window._extendCancel();return false">Cancel</button>';
 document.body.appendChild(banner);
 _extendState.escHandler=(ev)=>{ if(ev.key==='Escape') window._extendCancel(); };
 document.addEventListener('keydown', _extendState.escHandler);
 _extendState.mapClickHandler=async (ev)=>{
   if(_extendState.busy) return;
   _extendState.busy=true;
   await _extendAppend(idx, ev.latlng);
   _extendState.busy=false;
 };
 map.on('click', _extendState.mapClickHandler);
};
window._extendCancel=function(){
 const idx=_extendState && _extendState.routeIdx;
 const wasNew=_extendState && _extendState.wasNew;
 _extendCleanup(true);
 // If this was a brand-new route and the user cancelled before drawing anything
 // useful, remove the stub so we don't leave a zombie route in R.
 if(wasNew && idx!=null){
   const r=R[idx];
   const useful = r && r.polys && r.polys.some(p=>p.length>=2);
   if(!useful){ R.splice(idx,1); wipeAndRebuildRoutes(); saveLocalRouteState(); }
 }
};
window._extendDone=async function(){
 if(!_extendState) return;
 const idx=_extendState.routeIdx;
 const orig=_extendState.orig;
 const wasNew=_extendState.wasNew;
 const r=R[idx];
 const useful = r && r.polys && r.polys.some(p=>p.length>=2);
 if(!useful){
   // user finished without drawing a real line — drop the stub if it was new
   _extendCleanup(false);
   if(wasNew && idx!=null){ R.splice(idx,1); wipeAndRebuildRoutes(); }
   saveLocalRouteState();
   return;
 }
 if(!orig){ _extendCleanup(false); return; }
 if(r.original_distance_km==null && r.distance_km!=null) r.original_distance_km=r.distance_km;
 if(r.original_elev_up_m==null && r.elev_up_m!=null) r.original_elev_up_m=r.elev_up_m;
 delete r.elev_up_m; delete r.profile;
 r.edited_at=(new Date()).toISOString();
 (r.edit_ops=r.edit_ops||[]).push({op:'extend', at:r.edited_at});
 _routeRecomputeDistance(r);
 _extendCleanup(false);
 saveLocalRouteState();
 // ORS-extended (or straight-line) segments come with no altitude — fill them
 // unless the whole route was alt-less to begin with (then leave to manual ⛰).
 await _fillMissingAltitudes(idx);
 buildRouteLayer(idx);
 saveLocalRouteState();
};
async function _extendAppend(idx, clickLL){
 const r=R[idx]; if(!r) return;
 if(!_extendState.orig) _extendState.orig=JSON.parse(JSON.stringify(r.polys));
 // First click on a brand-new (empty) route -> just plant the start vertex.
 if(!r.polys.length){
   r.polys.push([[clickLL.lat, clickLL.lng]]);
   buildRouteLayer(idx);
   _extendRefreshEndpointMarker(idx);
   return;
 }
 const cfg=window.MYMAP_CONFIG||{};
 const key=cfg.openRouteServiceApiKey;
 const profile=cfg.openRouteServiceProfile||'cycling-regular';
 const lastPoly=r.polys[r.polys.length-1];
 const fromPt=lastPoly[lastPoly.length-1];
 // No ORS key (only happens via Create-new flow): append a straight line.
 if(!key){
   if(lastPoly.length===1){
     lastPoly.push([clickLL.lat, clickLL.lng]);
   } else {
     r.polys.push([[fromPt[0],fromPt[1]], [clickLL.lat, clickLL.lng]]);
   }
   buildRouteLayer(idx);
   _extendRefreshEndpointMarker(idx);
   return;
 }
 const url='https://api.openrouteservice.org/v2/directions/'+encodeURIComponent(profile)
   +'?api_key='+encodeURIComponent(key)
   +'&start='+fromPt[1].toFixed(6)+','+fromPt[0].toFixed(6)
   +'&end='+clickLL.lng.toFixed(6)+','+clickLL.lat.toFixed(6);
 _elevBanner('Extending route via ORS…');
 try{
   const res=await fetch(url);
   if(!res.ok){
     let msg='ORS HTTP '+res.status;
     try{ const j=await res.json(); if(j&&j.error&&j.error.message) msg += ' — '+j.error.message; }catch(e){}
     throw new Error(msg);
   }
   const j=await res.json();
   const coords = j.features && j.features[0] && j.features[0].geometry && j.features[0].geometry.coordinates;
   if(!coords||!coords.length) throw new Error('ORS returned no route');
   const newPoly = coords.map(c=>[c[1], c[0]]);
   r.polys.push(newPoly);
   buildRouteLayer(idx);
   _extendRefreshEndpointMarker(idx);
   _elevBannerHide();
 }catch(e){
   _elevBanner('Extend failed: '+(e.message||e), true);
 }
}

function refreshRouteDirtyDots(){
 if(!SEED_ROUTES) return;
 const seedBy=new Map(SEED_ROUTES.map(s=>[s.seed_id,s]));
 R.forEach((r,i)=>{
   const it=itemByIdx[i]; if(!it) return;
   let dirty=false;
   if(r.seed_id==null) dirty=true;
   else {
     const s=seedBy.get(r.seed_id);
     if(!s) dirty=true;
     else if(normRoute(r)!==normRoute(s)) dirty=true;
   }
   it.classList.toggle('dirty', dirty);
 });
}

function routeCreateNew(){

 const hasORS = !!cfg.openRouteServiceApiKey;
 if(!hasORS){
   if(!confirm('No OpenRouteService key — clicks will draw straight lines instead of following streets.\n\nAdd `openRouteServiceApiKey` to config.js for cyclable routing.\n\nContinue drawing with straight lines?')) return;
 }
 const nm=prompt('Name of the new route:');
 if(nm==null || !nm.trim()) return;
 const gn=prompt('Group:', 'My routes');
 if(gn==null) return;
 const palette=_routePalette();
 const color=palette[Math.floor(Math.random()*palette.length)][1];
 const nowIso=(new Date()).toISOString();
 const r={
   id:'rt-new-'+nowIso.replace(/[^0-9]/g,'').slice(0,14),
   name:nm.trim(),
   group:gn.trim()||'My routes',
   polys:[],
   seed_id:null,
   color, weight:2, opacity:0.9,
   edited_at:nowIso,
   edit_ops:[{op:'create', at:nowIso}]
 };
 R.push(r);
 const newIdx=R.length-1;
 wipeAndRebuildRoutes();
 saveLocalRouteState();   // ticks the dirty badge immediately
 // Hand off to the extend flow in "draw" mode
 window.routeExtendStart(newIdx, {allowStraight:true, wasNew:true});
}

// Fit all routes into the part of the map NOT covered by the panel.
// Leaflet sizes the zoom to the current viewport; we just inset the left
// edge by the panel width (when open) so routes aren't hidden behind it.
function fitAll(){
 try{ map.invalidateSize(false); }catch(e){}   // recompute container size first (fixes the "needs a 2nd click" zoom)
 const panel=document.getElementById('panel');
 const open=panel && !panel.classList.contains('collapsed') &&
            getComputedStyle(panel).display!=='none';
 const mobile=window.matchMedia && window.matchMedia('(max-width:600px)').matches;
 let tl=[24,24];
 if(open){
   const r=panel.getBoundingClientRect();
   // desktop: panel is a tall LEFT sidebar -> inset the left by its width.
   // mobile: panel is a short box at the TOP -> inset the top by its height.
   tl = mobile ? [24, Math.round(r.height)+24] : [Math.round(r.width)+24, 24];
 }
 try{ map.fitBounds(bounds,{paddingTopLeft:tl,paddingBottomRight:[24,24],animate:false}); }
 catch(e){ try{ map.fitBounds(bounds.pad(.05)); }catch(_){} }
}

// ---- locate me (GPS), Google-Maps style: blue dot + accuracy ring, pan to it ----
(function(){
 const btn=document.getElementById('locBtn'); if(!btn) return;
 let dot=null,ring=null;
 btn.onclick=()=>{
   if(!navigator.geolocation){ window.__mmlog('geolocation unsupported',true); return; }
   btn.classList.add('busy');
   navigator.geolocation.getCurrentPosition(pos=>{
     btn.classList.remove('busy'); btn.classList.add('on');
     const ll=[pos.coords.latitude,pos.coords.longitude], acc=pos.coords.accuracy||0;
     if(!dot){
       ring=L.circle(ll,{radius:acc,color:'#4f9bff',weight:1,fillColor:'#4f9bff',fillOpacity:.12}).addTo(map);
       dot=L.circleMarker(ll,{radius:7,color:'#fff',weight:2,fillColor:'#1a73e8',fillOpacity:1}).addTo(map);
     } else { ring.setLatLng(ll).setRadius(acc); dot.setLatLng(ll); }
     dot.bringToFront();
     map.setView(ll, Math.max(map.getZoom(),14), {animate:true});
   }, err=>{
     btn.classList.remove('busy');
     window.__mmlog('location error: '+err.message,true);
     alert('Could not get your location: '+err.message);
   }, {enableHighAccuracy:true, timeout:10000, maximumAge:30000});
 };
})();

// Combined dirty count: pins + routes (single badge). Added, removed, edited each
// count as one. Drives the admin button so you know there's something to save.
function pinDiffCount(){
 if(SEED_PINS==null) return 0;
 const k=p=>(p.name||'')+'@'+p.coords[0].toFixed(4)+','+p.coords[1].toFixed(4);
 const norm=p=>JSON.stringify(p.place||null);
 const sm=new Map(); SEED_PINS.forEach(p=>sm.set(k(p),norm(p)));
 const pm=new Map(); PINS.forEach(p=>pm.set(k(p),norm(p)));
 let n=0;
 pm.forEach((v,key)=>{ if(!sm.has(key)) n++; else if(sm.get(key)!==v) n++; });
 sm.forEach((_,key)=>{ if(!pm.has(key)) n++; });
 return n;
}
function diffCount(){ return pinDiffCount() + routeDiffCount(); }
function updateDirtyBadge(){
 const btn=document.getElementById('adminBtn'); if(!btn) return;
 const n=diffCount();
 let b=btn.querySelector('.dirty-badge');
 if(n>0){
   if(!b){ b=document.createElement('span'); b.className='dirty-badge'; btn.appendChild(b); }
   b.textContent=n>99?'99+':n;
   btn.title='Save pins to repo (admin) — '+n+' unsaved change'+(n>1?'s':'');
 } else {
   if(b) b.remove();
   btn.title='Save pins to repo (admin)';
 }
}

function pinSvg(color){

   +"<path d='M12 1c5.5 0 10 4.3 10 9.7 0 6-4.6 11.7-9.4 19.6a.7.7 0 0 1-1.2 0C6.6 22.4 2 16.7 2 10.7 2 5.3 6.5 1 12 1z' fill='"+color+"' stroke='white' stroke-width='1.2'/>"

}
// composited My Maps icon image URL (withPin=true → container + glyph; false → glyph only)
function mmIconUrl(id,color,withPin){

 const n=ICON_NAME[id]||'blank-shape_pin_4x', col=(color||'#2979ff').replace('#','').toUpperCase();

   ? 'icons/onion/SHARED-mymaps-container-bg_4x.png,icons/onion/SHARED-mymaps-container_4x.png,icons/onion/'+id+'-'+n+'.png'
   : 'icons/onion/'+id+'-'+n+'.png';
 return 'https://mt.googleapis.com/vt/icon/name='+layers+'&highlight='+(withPin?'ff000000,'+col:col)+'&scale=2.0';
}
function pinIcon(id,color){
 if(id===1899) return L.icon({iconUrl:pinSvg(color||'#2979ff'),iconSize:[24,36],iconAnchor:[12,36],popupAnchor:[0,-34]});
 // composited My Maps image is square (28x28 @1x); keep it square or it distorts

   seed_id:(o.seed_id==null?null:o.seed_id)};

 m.on('dragend',()=>{ const ll=m.getLatLng(); p.coords=[ll.lat,ll.lng]; savePins(); });
 m.addTo(pinLayer); p.marker=m; PINS.push(p);

   msgEl.style.fontWeight='600'; window.__mmlog('admin: '+m, !!err); };
 // inline X (ghForget) lives inside the token input; only visible when a token is stored
 const refreshTkClr=()=>{ document.getElementById('ghForget').hidden = !localStorage.getItem(TKEY); };
 refreshTkClr();

 document.getElementById('ghDiscard').onclick=()=>{

   if(!confirm('Discard '+n+' local change'+(n>1?'s':'')+' and restore the repo\'s pins & routes?')) return;

 // After committing, watch the DEPLOYED file until it matches what we pushed,
 // so the UI can say "live" rather than guessing a delay. Only meaningful on the
 // Pages origin (there the relative URL IS the deployed file); on localhost the
 // relative URL is the local copy, so we skip and just report the commit.
 function pollDeploy(expected){
   if(!/\.github\.io$/.test(location.hostname)){
     setMsg('✓ Committed. It’ll be live on the site in ~1 min.'); return;
   }
   let tries=0; const MAX=30;
   (function check(){
     fetch('data/maps/'+MAP_ID+'/pins.json?_='+Date.now(),{cache:'no-store'})
       .then(r=>r.ok?r.text():Promise.reject('HTTP '+r.status))
       .then(t=>{
         if(t.trim()===expected.trim()){ setMsg('✓ Live — your pins are now the shared default.'); }
         else if(++tries<MAX){ setMsg('✓ Committed — deploying… ('+tries+')'); setTimeout(check,4000); }
         else setMsg('✓ Committed. Deploy is taking longer than usual — it’ll appear shortly.');
       })
       .catch(()=>{ if(++tries<MAX) setTimeout(check,4000);
         else setMsg('✓ Committed (couldn’t auto-confirm the deploy).'); });
   })();
 }
 // shared helper: PUT a single file to the repo. Returns the commit short SHA.
 async function commitFile(token, repoPath, jsonStr){
   const api='https://api.github.com/repos/'+repo.owner+'/'+repo.name+'/contents/'+repoPath;
   const hdr={Authorization:'Bearer '+token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
   const b64=btoa(unescape(encodeURIComponent(jsonStr)));
   let sha=null;
   const g=await fetch(api+'?ref='+encodeURIComponent(repo.branch),{headers:hdr});
   window.__mmlog('admin: GET '+repoPath+' sha -> HTTP '+g.status);
   if(g.ok){ sha=(await g.json()).sha; }
   else if(g.status!==404){ const e=await g.json().catch(()=>({})); throw new Error('read '+repoPath+' '+g.status+': '+(e.message||'')); }
   const body={message:'Update '+repoPath+' via MyMap admin',content:b64,branch:repo.branch};
   if(sha) body.sha=sha;
   const r=await fetch(api,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},hdr),body:JSON.stringify(body)});
   window.__mmlog('admin: PUT '+repoPath+' -> HTTP '+r.status);
   if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error('write '+repoPath+' '+r.status+': '+(e.message||'')); }
   return ((await r.json().catch(()=>({}))).commit||{}).sha||'';
 }

   window.__mmlog('admin: Save clicked');

   if(!token){ setMsg('Paste a token first.',true); return; }
   localStorage.setItem(TKEY,token); refreshTkClr();   // remember for next time + reveal the inline X
   const routesPath='data/maps/'+MAP_ID+'/routes.geojson';
   const pinsDirty=pinDiffCount()>0, routesDirty=routeDiffCount()>0;
   if(!pinsDirty && !routesDirty){ setMsg('Nothing to save — no local changes.'); return; }
   const json=JSON.stringify(PINS.map(p=>({name:p.name,coords:p.coords,place:p.place||null})),null,2)+'\n';
   const routesJson=routesDirty ? JSON.stringify({type:'FeatureCollection',features:R.map(routeToFeature)},null,2)+'\n' : null;
   saveBtn.disabled=true;
   const what=[]; if(pinsDirty) what.push(PINS.length+' pin(s)'); if(routesDirty) what.push(R.length+' route(s)');
   setMsg('Saving '+what.join(' + ')+'…');
   try{
     let cs1='', cs2='';
     if(pinsDirty){
       cs1=await commitFile(token, path, json);

     }
     if(routesDirty){

// shipped beside the map data (data/maps/<id>/pins.json). Seeded pins are NOT
// written to localStorage until the user edits, so they keep tracking the file.

 // "unsaved local changes" diff and offer Discard. Runs in parallel with the

     renderPinsList(); updateCounts(); updateDirtyBadge();
   });
 } else {
   renderPinsList(); updateCounts();   // saved===[] : user cleared, respect it

   return 2*R*Math.asin(Math.sqrt(x));}
 function altAt(prof,km){
   if(!prof||!prof.length) return 0;
   if(km<=prof[0][0]) return prof[0][1];
   for(let i=1;i<prof.length;i++){ if(km<=prof[i][0]){
     const a=prof[i-1],b=prof[i],t=(b[0]-a[0])?(km-a[0])/(b[0]-a[0]):0;
     return Math.round(a[1]+(b[1]-a[1])*t); } }
   return prof[prof.length-1][1];
 }
 const kmlColor=hex=>{const h=(hex||EXP_COLOR).replace('#','');return 'ff'+h.slice(4,6)+h.slice(2,4)+h.slice(0,2);};
 const cdata=s=>`<![CDATA[${String(s==null?'':s).replace(/]]>/g,']]]]><![CDATA[>')}]]>`;
 function routeKML(r){
   let cum=0,last=null;   // bake altitude (interpolated from profile) into 3-D coords
   const segs=(r.polys||[]).map(poly=>poly.map(pt=>{
     if(last) cum+=havKm(last,pt); last=pt;
     return pt[1]+','+pt[0]+','+altAt(r.profile,cum);
   }).join(' '));
   const geom=segs.length>1
     ? `<MultiGeometry>${segs.map(s=>`<LineString><tessellate>1</tessellate><coordinates>${s}</coordinates></LineString>`).join('')}</MultiGeometry>`
     : `<LineString><tessellate>1</tessellate><coordinates>${segs[0]||''}</coordinates></LineString>`;
   const maxE=(r.profile&&r.profile.length)?Math.max(...r.profile.map(p=>p[1])):null;
   const bits=[];
   if(r.distance_km) bits.push(r.distance_km+' km');
   if(r.elev_up_m)   bits.push('&#8593;'+r.elev_up_m+' m');
   if(maxE!=null)    bits.push('max '+Math.round(maxE)+' m');
   let dh=bits.join(' &#183; ');
   if(r.intro_url)   dh+=(dh?'<br/>':'')+`<a href="${esc(r.intro_url)}">Source &#8599;</a>`;   // just the link; name is in the source field
   const ed=`<ExtendedData><Data name="category"><value>${cdata(r.group||'')}</value></Data>`
     +(r.source?`<Data name="source"><value>${cdata(r.source)}</value></Data>`:'')
     +(r.distance_km?`<Data name="distance_km"><value>${r.distance_km}</value></Data>`:'')
     +(r.elev_up_m?`<Data name="elev_up_m"><value>${r.elev_up_m}</value></Data>`:'')
     +`</ExtendedData>`;
   return `<Placemark><name>${esc(r.name||'')}</name><description>${cdata(dh)}</description>`
     +`<Style><LineStyle><color>${kmlColor(r.color)}</color><width>${r.weight||2}</width></LineStyle></Style>`
     +ed+geom+`</Placemark>`;
 }
 // saved-place pin -> KML Point Placemark, using the same Google teardrop icon
 const PIN_LAYER='My places';
 // Google My Maps renders pins from a "#icon-<ID>-<COLOR>" styleUrl (its "Newer"
 // icon set), tinting by color and IGNORING the <Icon><href> (which we set to its
 // blank-pin fallback for other apps). PIN_ICON_ID resolves the pin's My Maps id.
 const PIN_KML_BLANK='https://www.gstatic.com/mapspro/images/stock/503-wht-blank_maps.png';
 const pinStyleId=p=>'icon-'+PIN_ICON_ID(p)+'-'+PIN_COLOR(p).replace('#','').toUpperCase();
 function pinKML(p){
   const pl=p.place||{};
   const bits=[];
   if(pl.address) bits.push(esc(pl.address));
   if(pl.rating)  bits.push('★ '+esc(pl.rating));
   let dh=bits.join('<br/>');
   if(pl.website) dh+=(dh?'<br/>':'')+`<a href="${esc(pl.website)}">Website</a>`;
   if(pl.url)     dh+=(dh?'<br/>':'')+`<a href="${esc(pl.url)}">View in Google Maps &#8599;</a>`;
   const ed=`<ExtendedData><Data name="category"><value>${cdata(PIN_LAYER)}</value></Data></ExtendedData>`;
   return `<Placemark><name>${esc(p.name||'')}</name>`
     +(dh?`<description>${cdata(dh)}</description>`:'')
     +`<styleUrl>#${pinStyleId(p)}</styleUrl>${ed}`
     +`<Point><coordinates>${p.coords[1]},${p.coords[0]},0</coordinates></Point></Placemark>`;
 }
 // shared <Style> blocks for the pins' My-Maps icon/color combos (one per combo)
 function pinStyleDefs(pins){
   const seen={}; let out='';
   (pins||[]).forEach(p=>{const id=pinStyleId(p); if(seen[id])return; seen[id]=1;
     out+=`<Style id="${id}"><IconStyle><color>${kmlColor((p.place||{}).color||'#2979ff')}</color>`
       +`<Icon><href>${PIN_KML_BLANK}</href></Icon></IconStyle></Style>`;});
   return out;
 }
 function buildKML(idx,pins){
   const byG={}; idx.forEach(i=>{const g=R[i].group||'Routes';(byG[g]=byG[g]||[]).push(i);});
   let body=''; Object.keys(byG).forEach(g=>{
     body+=`<Folder><name>${esc(g)}</name>`+byG[g].map(i=>routeKML(R[i])).join('')+`</Folder>`; });
   let styleDefs='';
   if(pins&&pins.length){
     styleDefs=pinStyleDefs(pins);
     body+=`<Folder><name>${esc(PIN_LAYER)}</name>`+pins.map(pinKML).join('')+`</Folder>`;
   }
   return `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2">`
     +`<Document><name>MyMap export</name>${styleDefs}${body}</Document></kml>`;
 }
 function dl(name,content,type){const a=document.createElement('a');
   a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;
   document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},0);}
 const scope=()=>(document.querySelector('input[name="expScope"]:checked')||{}).value||'all';
 const selIdx=()=> scope()==='all' ? R.map((_,i)=>i)
   : [...tree.querySelectorAll('input.exp-rt:checked')].map(c=>+c.dataset.i);
 const selPins=()=> scope()==='all' ? PINS.slice()
   : [...tree.querySelectorAll('input.exp-pin:checked')]
       .map(c=>PINS.find(p=>p.id===+c.dataset.id)).filter(Boolean);
 function updateMeter(){
   const idx=selIdx(), pins=selPins();
   // pins form one extra "My places" layer; each pin is 1 feature + 1 point
   const per={}; idx.forEach(i=>{const g=R[i].group;per[g]=(per[g]||0)+1;});
   if(pins.length) per[PIN_LAYER]=pins.length;
   const layers=Object.keys(per).length, feat=idx.length+pins.length;
   const pts=idx.reduce((s,i)=>s+ptsOf(R[i]),0)+pins.length;
   const maxPer=layers?Math.max(...Object.values(per)):0;
   const over=layers>L_LAYERS||pts>L_PTS||feat>L_FEAT||maxPer>L_PER;
   const g=(v,l)=>`<span class="${v>l?'over':''}">${fmtN(v)}/${fmtN(l)}</span>`;
   const ic=n=>`<span class="mi">${n}</span>`;
   meter.innerHTML=(over?`<div class="warn">&#9888; Exceeds Google My Maps</div>`:'')
     +`${ic('layers')}${g(layers,L_LAYERS)} &nbsp; ${ic('polyline')}${g(pts,L_PTS)} &nbsp; ${ic('route')}${g(feat,L_FEAT)}`;
 }
 function buildTree(){
   tree.innerHTML='';
   if(PINS.length){
     const wrap=document.createElement('div');wrap.className='exp-grp';
     wrap.innerHTML=`<label><span class="tw">&#9654;</span><input type="checkbox" class="exp-pg"> ${esc(PIN_LAYER)}`
       +`<span class="gcnt">${PINS.length} &#183; ${fmtN(PINS.length)} pts</span></label>`
       +`<div class="exp-rts">`+PINS.map(p=>`<label><input type="checkbox" class="exp-pin" data-id="${p.id}"> ${esc(p.name)}`
         +`<span class="gcnt">1</span></label>`).join('')+`</div>`;
     const pg=wrap.querySelector('.exp-pg'),rts=wrap.querySelector('.exp-rts'),tw=wrap.querySelector('.tw');
     tw.onclick=e=>{e.preventDefault();rts.classList.toggle('open');tw.innerHTML=rts.classList.contains('open')?'&#9660;':'&#9654;';};
     pg.onchange=()=>{rts.querySelectorAll('.exp-pin').forEach(c=>c.checked=pg.checked);pg.indeterminate=false;updateMeter();};
     rts.querySelectorAll('.exp-pin').forEach(c=>c.onchange=()=>{
       const all=[...rts.querySelectorAll('.exp-pin')];
       pg.checked=all.every(x=>x.checked); pg.indeterminate=!pg.checked&&all.some(x=>x.checked);
       updateMeter();
     });
     tree.appendChild(wrap);
   }
   Object.keys(groups).sort().forEach(gn=>{
     const idxs=groups[gn], pts=idxs.reduce((s,i)=>s+ptsOf(R[i]),0);
     const wrap=document.createElement('div');wrap.className='exp-grp';
     wrap.innerHTML=`<label><span class="tw">&#9654;</span><input type="checkbox" class="exp-g"> ${esc(gn)}`
       +`<span class="gcnt">${idxs.length} &#183; ${fmtN(pts)} pts</span></label>`
       +`<div class="exp-rts">`+idxs.map(i=>`<label><input type="checkbox" class="exp-rt" data-i="${i}"> ${esc(R[i].name)}`
         +`<span class="gcnt">${fmtN(ptsOf(R[i]))}</span></label>`).join('')+`</div>`;
     const gchk=wrap.querySelector('.exp-g'),rts=wrap.querySelector('.exp-rts'),tw=wrap.querySelector('.tw');
     tw.onclick=e=>{e.preventDefault();rts.classList.toggle('open');tw.innerHTML=rts.classList.contains('open')?'&#9660;':'&#9654;';};
     gchk.onchange=()=>{rts.querySelectorAll('.exp-rt').forEach(c=>c.checked=gchk.checked);gchk.indeterminate=false;updateMeter();};
     rts.querySelectorAll('.exp-rt').forEach(c=>c.onchange=()=>{
       const all=[...rts.querySelectorAll('.exp-rt')];
       gchk.checked=all.every(x=>x.checked); gchk.indeterminate=!gchk.checked&&all.some(x=>x.checked);
       updateMeter();
     });
     tree.appendChild(wrap);
   });
 }
 document.getElementById('exportBtn').onclick=()=>{ modal.hidden=false; updateMeter(); };
 document.getElementById('expClose').onclick=()=>{ modal.hidden=true; };
 modal.onclick=e=>{ if(e.target===modal) modal.hidden=true; };
 document.querySelectorAll('input[name="expScope"]').forEach(rd=>rd.onchange=()=>{
   const sel=scope()==='sel'; tree.hidden=!sel;
   if(sel && !tree.childElementCount) buildTree();
   updateMeter();
 });
 document.getElementById('expGo').onclick=async()=>{
   const idx=selIdx(), pins=selPins();
   if(!idx.length && !pins.length){ alert('Nothing selected to export.'); return; }
   const kml=buildKML(idx,pins);
   const fmt=(document.querySelector('input[name="expFmt"]:checked')||{}).value||'kml';
   const base=(((document.getElementById('mapTitle')||{}).textContent||MAP_ID)
     .replace(/[\\/:*?"<>|]+/g,'_').trim().slice(0,80))||'mymap';   // file name = map name
   if(fmt==='kmz' && window.JSZip){
     const z=new JSZip(); z.file('doc.kml',kml);
     dl(base+'.kmz', await z.generateAsync({type:'blob'}), 'application/vnd.google-earth.kmz');
   } else dl(base+'.kml', kml, 'application/vnd.google-earth.kml+xml');
   modal.hidden=true;
 };
})();
}  // end boot()
